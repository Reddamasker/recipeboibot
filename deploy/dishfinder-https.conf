server {
    listen 80;
    server_name dishfinder.ru www.dishfinder.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://dishfinder.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.dishfinder.ru;
    ssl_certificate /etc/letsencrypt/live/dishfinder/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dishfinder/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://dishfinder.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name dishfinder.ru;
    ssl_certificate /etc/letsencrypt/live/dishfinder/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dishfinder/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    access_log /var/log/nginx/dishfinder-access.log;
    error_log /var/log/nginx/dishfinder-error.log;

    location / {
        proxy_pass https://recipeboibot.72-56-97-79.sslip.io;
        proxy_ssl_server_name on;
        proxy_ssl_name recipeboibot.72-56-97-79.sslip.io;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host recipeboibot.72-56-97-79.sslip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
