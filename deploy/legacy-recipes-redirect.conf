server {
    listen 80;
    server_name recipes.spas-sky.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen 8443 ssl http2;
    server_name recipes.spas-sky.ru;
    ssl_certificate /etc/letsencrypt/live/recipeboibot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipeboibot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    location / { return 302 https://recipeboibot.89-223-123-75.sslip.io$request_uri; }
}
