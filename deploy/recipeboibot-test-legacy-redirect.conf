server {
    listen 80;
    server_name recipeboibot-test.72-56-97-79.sslip.io;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 302 https://recipeboibot-test.89-223-123-75.sslip.io$request_uri; }
}

server {
    listen 443 ssl;
    server_name recipeboibot-test.72-56-97-79.sslip.io;
    ssl_certificate /etc/letsencrypt/live/recipeboibot-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipeboibot-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    location / { return 302 https://recipeboibot-test.89-223-123-75.sslip.io$request_uri; }
}
