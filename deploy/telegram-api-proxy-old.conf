server {
    listen 80;
    server_name recipeboibot.72-56-97-79.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name recipeboibot.72-56-97-79.sslip.io;
    ssl_certificate /etc/letsencrypt/live/recipeboibot-vpn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipeboibot-vpn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;

    location ^~ /telegram-api/ {
        allow 89.223.123.75;
        deny all;
        access_log off;
        error_log /dev/null crit;
        proxy_pass https://api.telegram.org/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.telegram.org;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
    }

    location / { return 302 https://recipeboibot.89-223-123-75.sslip.io$request_uri; }
}
