server {
    listen 80;
    server_name recipeboibot.89-223-123-75.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name recipeboibot.89-223-123-75.sslip.io;
    ssl_certificate /etc/letsencrypt/live/recipeboibot-stage/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipeboibot-stage/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    access_log /var/log/nginx/recipeboibot-vpn-access.log;
    error_log /var/log/nginx/recipeboibot-vpn-error.log;

    location / {
        proxy_pass http://127.0.0.1:3087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
